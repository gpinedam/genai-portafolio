<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GenAI Portafolio - AI Chat</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-view="home">
    <div class="page">
      <header class="top">
        <div class="avatar-card">
          <div class="avatar-frame">
            <img src="assets/avatar.png" alt="Avatar" />
          </div>
        </div>

        <nav class="pill-nav">
          <a class="nav-link active" href="#home" data-view="home">Home</a>
          <a class="nav-link" href="#chat" data-view="chat">AI Chat</a>
          <a class="nav-link" href="#projects" data-view="projects">Projects</a>
          <a class="nav-link" href="#contact" data-view="contact">Contact</a>
        </nav>

        <section class="intro-card">
          <h2 id="introTitle">AI Chat</h2>
          <p id="introText">
            Chat con IA generativa, se pueden hacer consultas sobre el perfil.
          </p>
        </section>
      </header>

      <main class="content">
        <section class="view view-home">
          <div class="panel-shell">
            <div class="panel-content">
              <div class="panel-heading">HOME</div>
              <div class="panel-lines" id="homeMarkdown"></div>
            </div>
          </div>
        </section>

        <section class="view view-chat">
          <div class="chat-shell">
            <div class="chat-panel">
              <div class="messages" id="messages">
                <div class="msg bot">Hola, soy tu asistente. Pregunta lo que quieras.</div>
              </div>

              <div class="composer">
                <input
                  id="userInput"
                  type="text"
                  placeholder="Escribe tu mensaje..."
                  autocomplete="off"
                />
                <button id="sendBtn" type="button">Enviar</button>
              </div>
            </div>
          </div>
        </section>

        <section class="view view-projects">
          <div class="panel-shell">
            <div class="panel-content">
              <div class="project-list" id="projectsMarkdown"></div>
            </div>
          </div>
        </section>

        <section class="view view-contact">
          <div class="panel-shell">
            <div class="contact-grid">
              <div class="contact-main"></div>
              <div class="contact-side"></div>
              <div class="contact-input"></div>
              <div class="contact-button"></div>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js" defer></script>
    <script src="app.js" defer></script>
  </body>
</html>
